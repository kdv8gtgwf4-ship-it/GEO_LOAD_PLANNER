name: Build Windows EXE

on:
  workflow_dispatch:   # lets you start the build manually with a button
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and Pillow
        run: python -m pip install --upgrade pyinstaller pillow

      - name: Build EXE
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path logo.png) { $extra = @('--add-data', 'logo.png;.') }
          python -m PyInstaller --onefile --windowed --clean --name GeoContainerLoadingPlanner @extra geo_container_loading_planner.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GeoContainerLoadingPlanner-windows
          path: dist/GeoContainerLoadingPlanner.exe
