name: Build Windows EXE

on:
  workflow_dispatch:   # lets you start the build manually with a button
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --windowed --clean --name GeoContainerLoadingPlanner geo_container_loading_planner.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GeoContainerLoadingPlanner-windows
          path: dist/GeoContainerLoadingPlanner.exe
